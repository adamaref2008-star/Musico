<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="platform.css" />
  <style>
    html, body { background: transparent; overflow: hidden; }
    #wrap { position: absolute; top: 0; left: 50%; transform: translateX(-50%); }
    #isl { position: relative; background: #000; color: #fff; overflow: hidden; border-radius: 0 0 28px 28px;
      width: 174px; height: 36px; transition: width .45s cubic-bezier(.2,.9,.25,1.05), height .45s cubic-bezier(.2,.9,.25,1.05), border-radius .45s, margin .45s; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    #isl.float { margin-top: 10px; border-radius: 22px; }
    #isl.glass { background: rgba(10,10,12,var(--glass,.72)); backdrop-filter: blur(24px) saturate(1.4); }
    #isl.open { width: 432px; height: 214px; border-radius: 0 0 40px 40px; }
    #isl.float.open { border-radius: 40px; }
    #isl.open.big { width: 750px; height: 236px; }
    .pill { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; transition: opacity .2s; }
    .pill .d { width: 20px; height: 20px; border-radius: 50%; background: #1b1b1f center/cover; display: grid; place-items: center; }
    .pill .d:not(.has)::after { content: ''; width: 3px; height: 7px; border-radius: 2px; background: #bbb; }
    .pill .eq { display: flex; gap: 2px; align-items: flex-end; height: 10px; }
    .pill .eq i { width: 2px; background: #cfcfd6; border-radius: 1px; height: 4px; }
    .playing .pill .eq i { animation: eq .9s infinite ease-in-out; }
    .pill .eq i:nth-child(2) { animation-delay: .15s !important; } .pill .eq i:nth-child(3) { animation-delay: .3s !important; } .pill .eq i:nth-child(4) { animation-delay: .45s !important; }
    @keyframes eq { 0%,100% { height: 3px; } 50% { height: 10px; } }
    .open .pill { opacity: 0; pointer-events: none; }
    .full { position: absolute; inset: 0; opacity: 0; transition: opacity .25s; padding: 14px 20px; pointer-events: none; }
    .open .full { opacity: 1; transition-delay: .12s; pointer-events: auto; }
    .dots { display: flex; gap: 6px; height: 10px; align-items: center; }
    .dots i { width: 7px; height: 7px; border-radius: 50%; background: #555; } .dots i:first-child { width: 22px; border-radius: 4px; background: #eee; }
    .xp { position: absolute; top: 10px; right: 14px; width: 28px; height: 28px; border-radius: 50%; background: #2a2a2d; display: grid; place-items: center; font-size: 13px; }
    .pl { display: flex; gap: 14px; align-items: center; margin-top: 12px; }
    .pl .art { width: 58px; height: 58px; border-radius: 8px; }
    .pl .ti { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 270px; }
    .pl .ar { font-size: 14px; color: #a6a6ad; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 270px; margin-top: 2px; }
    .prog { display: flex; align-items: center; gap: 12px; margin-top: 10px; font-size: 13px; font-weight: 600; }
    .prog .bar { flex: 1; margin: 0; background: #3a3a3e; }
    .prog .bar b { background: #bdbdc4; }
    .cc { display: flex; justify-content: space-between; align-items: center; padding: 0 90px 0 90px; margin-top: 8px; }
    .cc button { all: unset; font-size: 24px; } .cc button.big { font-size: 34px; }
    .cc button:active { transform: scale(.88); }
    .big-extra { display: none; }
    .big .big-extra { display: flex; }
    .big .left { width: 300px; flex: none; }
    .big .full { display: flex; gap: 0; padding: 0; }
    .big .full > * { padding: 14px 20px; }
    .left { width: 100%; position: relative; }
    .ring { width: 140px; height: 140px; flex: none; position: relative; margin: auto; }
    .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .6s; }
    .ring .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 22px; font-weight: 600; line-height: 1; }
    .ring .c small { display: block; font-size: 11px; color: #2f7df6; font-weight: 700; margin-top: 3px; }
    .cal { width: 220px; border-left: 1px solid #222; }
    .cal .m { font-size: 22px; font-weight: 700; }
    .cal .days { display: flex; justify-content: space-between; margin-top: 12px; text-align: center; font-size: 14px; color: #888; }
    .cal .days div small { display: block; font-size: 10px; }
    .cal .days .today { color: #fff; font-weight: 700; font-size: 17px; }
    .cal a { color: #2f8cff; font-weight: 600; font-size: 14px; display: block; margin-top: 14px; }
    .tools { width: 40px; display: flex; flex-direction: column; gap: 12px; align-items: center; padding-top: 46px !important; color: #9a9aa2; font-size: 15px; }
    .tools span:first-child { color: #2f7df6; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="isl">
      <div class="pill"><span class="d" id="dot"></span><span class="eq"><i></i><i></i><i></i><i></i></span></div>
      <div class="full" id="full">
        <div class="left">
          <div class="dots"><i></i><i></i><i></i><i></i></div>
          <div class="pl"><div class="art" id="art"></div><div style="min-width:0"><div class="ti" id="ti"></div><div class="ar" id="ar"></div></div></div>
          <div class="prog"><span id="a">0:00</span><div class="bar" id="barw"><b id="bar"></b></div><span id="b">0:00</span></div>
          <div class="cc"><button id="pv"></button><button class="big" id="pl"></button><button id="nx"></button></div>
        </div>
        <div class="ring big-extra"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="62" stroke="#14233f"/><circle id="r1" cx="70" cy="70" r="62" stroke="#2f7df6" stroke-dasharray="390" stroke-dashoffset="370"/><circle cx="70" cy="70" r="50" stroke="#2d2410"/><circle cx="70" cy="70" r="38" stroke="#12301c"/><circle id="r3" cx="70" cy="70" r="38" stroke="#3ddc6f" stroke-dasharray="239" stroke-dashoffset="120"/></svg><div class="c"><div><span id="cpuv">0%</span><small>CPU</small></div></div></div>
        <div class="cal big-extra" style="flex-direction:column"><div class="m" id="mon"></div><div class="days" id="days"></div><a>Show my calendar</a></div>
        <div class="tools big-extra"><span>&#9638;</span><span>&#9729;</span><span>&#9636;</span><span>&#9201;</span><span>&#9776;</span></div>
        <div class="xp" id="xp"></div>
      </div>
    </div>
  </div>
  <script src="icons.js"></script>
  <script src="shared.js"></script>
  <script src="island.js"></script>
</body>
</html>
